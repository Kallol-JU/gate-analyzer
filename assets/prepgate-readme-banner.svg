<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PrepGate — Prepare with purpose. Practise with confidence.</title>
  <desc id="desc">A GATE CSE preparation platform with a clean exam interface preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#18294a"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5276f5"/><stop offset="1" stop-color="#2d4acb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#050b18" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="40" r="240" fill="#3558d8" opacity=".12"/>
  <circle cx="35" cy="500" r="250" fill="#6b8cff" opacity=".08"/>
  <g transform="translate(76 76)">
    <rect x="0" y="0" width="22" height="22" rx="5" fill="#fff" opacity=".9"/>
    <rect x="27" y="0" width="22" height="22" rx="5" fill="#7958d8"/>
    <rect x="0" y="27" width="22" height="22" rx="5" fill="#e35b56"/>
    <rect x="27" y="27" width="22" height="22" rx="5" fill="#35a66b"/>
    <text x="66" y="36" fill="#f7f9ff" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">PrepGate</text>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="76" y="220" fill="#a9bcff" font-size="14" font-weight="700" letter-spacing="3">GATE CSE PREPARATION</text>
    <text x="76" y="290" fill="#ffffff" font-size="53" font-weight="750">Prepare with purpose.</text>
    <text x="76" y="354" fill="#ffffff" font-size="53" font-weight="750">Practise with confidence.</text>
    <text x="78" y="410" fill="#c2ccdf" font-size="19">Timed tests · Focused practice · Detailed review</text>
  </g>
  <g transform="translate(720 105)" filter="url(#shadow)">
    <rect width="405" height="315" rx="18" fill="#ffffff"/>
    <path d="M0 18Q0 0 18 0H387Q405 0 405 18V55H0Z" fill="#f4f6fb"/>
    <circle cx="24" cy="27" r="5" fill="#d0d6e4"/><circle cx="43" cy="27" r="5" fill="#d0d6e4"/><circle cx="62" cy="27" r="5" fill="#d0d6e4"/>
    <text x="25" y="88" fill="#68748b" font-size="11" font-family="Arial,sans-serif" font-weight="700" letter-spacing="1.2">QUESTION 12 OF 65</text>
    <text x="25" y="124" fill="#17233b" font-size="17" font-family="Arial,sans-serif" font-weight="700">Which of the following statements</text>
    <text x="25" y="148" fill="#17233b" font-size="17" font-family="Arial,sans-serif" font-weight="700">about a binary search tree is true?</text>
    <g font-family="Arial,sans-serif" font-size="13" fill="#526078">
      <rect x="24" y="171" width="357" height="31" rx="7" fill="#f7f8fc" stroke="#e2e6ef"/><circle cx="42" cy="186" r="7" fill="none" stroke="#aab4c6"/><text x="60" y="191">An inorder traversal is sorted</text>
      <rect x="24" y="210" width="357" height="31" rx="7" fill="#eef2ff" stroke="#5472e8"/><circle cx="42" cy="225" r="7" fill="#3152d4"/><text x="60" y="230" fill="#263f9f">Every node has exactly two children</text>
      <rect x="24" y="249" width="357" height="31" rx="7" fill="#f7f8fc" stroke="#e2e6ef"/><circle cx="42" cy="264" r="7" fill="none" stroke="#aab4c6"/><text x="60" y="269">The tree is always balanced</text>
    </g>
    <rect x="316" y="15" width="68" height="25" rx="7" fill="#e9edff"/><text x="350" y="32" fill="#304cc4" text-anchor="middle" font-size="11" font-family="Arial,sans-serif" font-weight="700">02:14:08</text>
  </g>
  <text x="76" y="480" fill="#8e9bb5" font-family="Arial,sans-serif" font-size="12">A focused workspace for your next GATE CSE attempt.</text>
</svg>
